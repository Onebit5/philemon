name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # the style guide and the naming table, as far as a machine can hold
  # them. no toolchain and no build, so it is the first answer back
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: style lint
        run: make lint

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm

      - name: versions, for when something inevitably breaks
        run: |
          gcc --version | head -1
          nasm -v

      - name: build
        run: make

      # philemon has no kernel of its own to boot, so the boot itself is
      # tested where there is one: velvet's boot test and selftests run
      # on an image this tree wrote
      - name: host tests
        run: make test

      - name: keep the loader
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: philemon
          path: |
            bin/philemon.bin
            bin/philemon64.bin
          if-no-files-found: warn
